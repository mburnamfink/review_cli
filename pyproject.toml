[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "review"
version = "0.1.0"
description = "CLI for managing book reviews"
requires-python = ">=3.11"
dependencies = [
    "click>=8.0",
    "httpx>=0.27",
    "pydantic>=2.0",
    "pillow>=10.0",
    "rich>=13.0",
    "python-frontmatter>=1.1",
    "tomli-w>=1.0",
    "PyYAML>=6.0",
]

[project.scripts]
review = "review.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/review"]
